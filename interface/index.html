<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Text Expander</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="overlay" class="overlay" style="display: none;"></div>
        <nav class="configuracaoinicial" id="configuracaoinicial" style="display: none; ">
            <div class="grupo-input">
                <ul>Bem-vindo! precisamos de algumas informações para configurar seu perfil.</ul>
                <input type="text" id="campo-nome" placeholder="Digite seu nome:"> 
                <input type="text" id="campo-email" placeholder="Digite seu email:">
                <input type ="text" id="campo-telefone" placeholder="Digite seu telefone:">
                <div class="grupo-botoes">
                    <button type="submit" class="btn-salvar" onclick="dados_user()">Salvar</button>
                </div>
            </div>


        </nav>

        

        <nav class="main" id="pagina_inicial" >

            <header>
                <button class="profile-btn" id="profileBtn" onclick="toggleMenu()">
                    <img src="perfil.png" alt="Foto de Perfil" class="profile-img">
                </button>

                <div class="google-popup" id="googleMenu">
                    <button class="profile-btn" id="profileBtn" onclick="toggleMenu()"><span id="perfil-sigla">--</span></button>
                    <button class="close-btn" onclick="toggleMenu()">&#x2715;</button>
        
                    <div class="menu-content">
                        <div>
                            <ul>NOME:</ul>
                            <strong id="perfil-nome"></strong>
                        </div>
                        <div>
                            <ul>EMAIL:</ul>
                            <span id="perfil-email"></span>
                        </div>
                        <div>
                            <ul>TELEFONE:</ul>
                            <span id="perfil-telefone"></span>
                        </div>
                        <button  class="botoes_main" onclick="gerenciarVariaveis()">⚙️</button>
                    </div>
                </div>
                
            </header>
            <main>
                <div class="bloco-atalhos"></div>
                <div class="bloco-laranja"></div>
            </main>
            <footer>
                <div class="grupo-botoes">
                    <button class="botoes_main" onclick="btn_abri()">Novo atalho ➕</button>
                    <button class="btn-deletar" onclick="deletarGatilho()">Deletar atalho 🗑️</button>
                    <button class="botoes_main" onclick="editaratalho('editar-atalho')">Editar atalho ✏️</button>
                    <button class="botoes_main" onclick="btn_adicionar_pasta()">Nova pasta 📁</button>
                    <button class="botoes_main" onclick="nada()">gerenciar variaveis ⚙️</button>

                </div>
            </footer>
        </nav>



        <nav class="novo-atalho" id="cadastro_atalhos" style="display: none;">
                <div class="grupo-input">
                    <label for="seletor-pasta" style="color: #38bdf8; font-size: 19px;">Salvar na pasta:</label>
                    <select id="seletor-pasta" class="campo-select">
                    </select>
                    <input type="text" id="campo-gatilho" placeholder="EX:\help ">
                    <textarea name=" mensagem" rows=" 40" cols="100" placeholder=" texto do gatilho" id="texto-do-gatilho"></textarea>
                    <div class="grupo-botoes">
                        <button type="button" class="btn-cancelar" onclick="btn_fechar('cadastro_atalhos')">Cancelar</button>
                        <button type="submit" class="btn-salvar"  onclick="adicionarNovoGatilho()">Salvar</button>
                    </div>
                </div>
        </nav>
        <nav class="novo-atalho" id="editar-atalho" style="display: none;">
                <div class="grupo-input">
                    <label for="seletor-pasta-edicao" style="color: #38bdf8; font-size: 19px;">Salvar na pasta:</label>
                    <select id="seletor-pasta-edicao" class="campo-select">
                    </select>
                    <input type="text" id="campo-gatilho-edicao" placeholder="EX:\help ">
                    <textarea name="mensagem-edicao" rows="40" cols="100" placeholder="Texto do gatilho" id="texto-do-gatilho-edicao"></textarea>
                    <div class="grupo-botoes">
                        <button type="button" class="btn-cancelar" onclick="btn_fechar('editar-atalho')">Cancelar</button>
                        <button type="button" class="btn-salvar" onclick="salvarEdicaoGatilho()">Salvar</button>
                    </div>
                </div>
        </nav>



        
        <nav class="novo-atalho" id="cadastro_pasta" style="display: none;">
                <div class="grupo-input">
                    <label for="criador-de-pasta" style="color: #38bdf8; font-size: 19px;">Salvar na pasta:</label>
                    <select id="criador-de-pasta" class="campo-select">
                    </select>
                    <input type="text" id="campo-pasta" placeholder="EX:novapasta ">
                    <div class="grupo-botoes">
                        <button type="button" class="btn-cancelar" onclick="btn_fechar('cadastro_pasta')">Cancelar</button>
                        <button type="submit" class="btn-salvar"  onclick="adicionarNovaPasta()">Salvar</button>
                    </div>
                </div>
        </nav>
        <script src="script.js"></script>
    </body>
</html>
