<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Expander</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <nav class="configuracaoinicial"style="display: none; ">
        <div class="grupo-input">
            <input type="text" id="campo-nome" placeholder="Digite seu nome"> 
            <input type="text" id="campo-email" placeholder="Digite seu email">
            <input type ="text" id="campo-telefone" placeholder="Digite seu telefone">
            <div class="grupo-botoes">
                <button type="button" class="btn-cancelar" ">Cancelar</button>
                <button type="submit" class="btn-salvar" ">Salvar</button>
            </div>
        </div>


    </nav>

    <nav class="main" id="pagina_inicial" >

        <header></header>
        <main>
            <div class="bloco-atalhos"></div>
            <div class="bloco-laranja"></div>
        </main>
        <footer>
            <button class="botoes" onclick=" btn_abri()">novo atalho +</button>
        </footer>
    </nav>



    <nav class="novo-atalho" id="cadastro_atalhos" style="display: none;">
            <div class="grupo-input">
                <input type="text" id="campo-gatilho" placeholder="EX:\help ">
                <textarea name=" mensagem" rows=" 40" cols="100" placeholder=" texto do gatilho" id="texto-do-gatilho"></textarea>
                <div class="grupo-botoes">
                    <button type="button" class="btn-cancelar" onclick="btn_fechar()">Cancelar</button>
                    <button type="submit" class="btn-salvar"  onclick="adicionarNovoGatilho()">Salvar</button>
                </div>
            </div>
    </nav>
    <script src="script.js"></script>
</body>

</html>
